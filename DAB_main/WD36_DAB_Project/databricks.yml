 # This is a Databricks asset bundle definition for WD36_DAB_Project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: WD36_DAB_Project
  uuid: 28f94bd4-f41c-4ea6-baf2-dbacb4b23162

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-b1f5d99c-2197.cloud.databricks.com/
    variables:
      catalog: dab_catalog
      schema: dab_schema
  prod:
    mode: production
    workspace:
      host: https://dbc-b1f5d99c-2197.cloud.databricks.com/
      # We explicitly deploy to /Workspace/Users/paarthasarathy1999@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/paarthasarathy1999@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prodcatalog
      schema: default
    permissions:
      - user_name: paarthasarathy1999@gmail.com
        level: CAN_MANAGE
